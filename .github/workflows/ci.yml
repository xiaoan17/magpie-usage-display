name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

jobs:
  companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ./companion
      - run: python -m unittest discover -s companion/tests -v

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install platformio
      - run: pio run

  mosaico-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify RGB565 transport and buffer restoration
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Iports/esp-mosaico/main ports/esp-mosaico/tests/rgb565_transport_test.c -o /tmp/rgb565-test
          /tmp/rgb565-test
